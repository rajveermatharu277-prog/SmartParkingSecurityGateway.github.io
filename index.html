<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart Parking Gateway</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f8;--card:#fff;--ink:#14213d;--mute:#5b6a86;--blue:#1d4ed8;--line:#d5deee;--ok:#16a34a;--bad:#dc2626;--warn:#d97706;--okbg:#dcfce7;--badbg:#fee2e2;--warnbg:#fef3c7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1424;--card:#16213a;--ink:#e8eefc;--mute:#9db0d3;--blue:#2447b8;--line:#2a3a5e;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24;--okbg:#12361f;--badbg:#431a1a;--warnbg:#3d2e0c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1424;--card:#16213a;--ink:#e8eefc;--mute:#9db0d3;--blue:#2447b8;--line:#2a3a5e;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24;--okbg:#12361f;--badbg:#431a1a;--warnbg:#3d2e0c;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,Segoe UI,sans-serif}
[hidden]{display:none!important}
button,input{font:inherit}
:focus-visible{outline:3px solid var(--warn);outline-offset:2px}

/* login */
#login{min-height:100%;display:grid;place-items:center;padding:20px}
.box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px}
.box h1{margin:0 0 4px;font-size:1.5rem;font-weight:800}
.box p{margin:0 0 20px;color:var(--mute)}
label{display:block;font-weight:700;font-size:.9rem;margin:14px 0 6px}
input{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.btn{width:100%;margin-top:22px;padding:13px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-weight:800;cursor:pointer}
.err{color:var(--bad);font-weight:700;min-height:1.3em;margin:12px 0 0;font-size:.9rem}
.hint{margin-top:14px;font-size:.8rem;color:var(--mute)}

/* dashboard */
#dash{height:100%;display:flex;flex-direction:column;padding:12px;gap:12px}
header{position:relative;background:var(--blue);color:#fff;border-radius:16px;padding:18px 90px;text-align:center;font-weight:800;font-size:1.4rem;letter-spacing:.04em;flex:none}
#out,#out2{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer;font-size:.8rem}
main{flex:1;min-height:0;display:grid;grid-template-rows:repeat(3,1fr) auto auto;gap:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;min-height:0}
.row.one{grid-template-columns:1fr}
.c{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:0;transition:background .3s}
.c .t{font-weight:700;color:var(--mute);font-size:clamp(.8rem,2.2vw,1rem)}
.c .v{font-weight:800;font-size:clamp(1.6rem,6vw,3.2rem);line-height:1.1;margin-top:4px}
.c .s{font-size:.8rem;color:var(--mute);margin-top:2px}
.c.ok{background:var(--okbg)}.c.ok .v{color:var(--ok)}
.c.bad{background:var(--badbg)}.c.bad .v{color:var(--bad)}
.c.warn{background:var(--warnbg)}.c.warn .v{color:var(--warn)}
.dot{display:inline-block;width:.55em;height:.55em;border-radius:50%;background:currentColor;margin-right:.3em;vertical-align:middle}
#user{height:100%;display:flex;flex-direction:column;padding:12px;gap:12px}
.freec{flex:1;min-height:0}
.freec .v{font-size:clamp(2rem,10vw,4.5rem)}
.pinb{position:absolute;left:12px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.18);border-radius:10px;padding:8px 12px;font-weight:700;font-size:.8rem;letter-spacing:0}
.slots{flex:2;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:12px}
@media (max-width:560px){.slots{grid-template-columns:repeat(2,1fr)}}
#wait,#revoked,#denied{position:fixed;inset:0;z-index:60;background:#000;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:12px}
#wait .w1,#revoked .w1,#denied .w1{font-size:clamp(1.6rem,6vw,2.4rem);font-weight:800}
#wait .w2,#revoked .w2,#denied .w2{font-size:clamp(1rem,3.5vw,1.3rem);color:#cbd5e1;font-weight:500}
#out3,#out4,#out5{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;background:transparent;color:#cbd5e1;border:1px solid #475569;border-radius:10px;padding:8px 12px;font-weight:700;font-size:.8rem;cursor:pointer}
.act{position:relative;padding:18px 12px;border:0;border-radius:16px;background:var(--blue);color:#fff;font-weight:800;font-size:1.05rem;cursor:pointer}
#modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}
.sheet{background:var(--card);border:1px solid var(--line);width:100%;max-width:560px;max-height:100%;border-radius:20px;display:flex;flex-direction:column;padding:16px}
.sh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.sh h2{margin:0;font-size:1.2rem;font-weight:800}
.x{border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:7px 12px;font-weight:700;cursor:pointer}
#ml{overflow-y:auto;min-height:0}
.r{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line)}
.n{font-weight:700}.id{color:var(--mute);font-size:.85rem;margin-top:2px}
.tag{font-weight:800;font-size:.8rem;padding:5px 10px;border-radius:99px;flex:none}
.tag.in{background:var(--okbg);color:var(--ok)}.tag.out{background:var(--warnbg);color:var(--warn)}
.rv,.rs{flex:none;border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer;background:transparent}
.rv{border:1.5px solid var(--bad);color:var(--bad)}.rv.on{background:var(--bad);color:#fff}
.rs{border:1.5px solid var(--ok);color:var(--ok)}
.empty{color:var(--mute);text-align:center;padding:20px 0}
select{padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.nd{position:absolute;top:10px;right:14px;width:16px;height:16px;border-radius:50%;background:#ef4444;border:2px solid #fff}
.q{padding:12px 2px;border-bottom:1px solid var(--line)}
.qf{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.qf select{flex:1;min-width:130px}
.qf input{width:120px;padding:10px 12px}
.qe{color:var(--bad);font-weight:700;font-size:.85rem;min-height:1.2em;margin-top:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<section id="login">
  <form class="box" id="f" autocomplete="on" onsubmit="return false">
    <h1>Smart Parking Gateway</h1>
    <p id="sub">Sign in to continue.</p>
    <div id="nmw" hidden><label for="nm">Full name</label><input id="nm" autocomplete="name" placeholder="Your full name"></div>
    <label for="em">Email</label>
    <input id="em" type="email" autocomplete="username" required placeholder="example@parking.com">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required placeholder="Your password">
    <p class="err" id="err" role="alert"></p>
    <button class="btn" id="go" type="submit">Sign in</button>
    <button class="btn" id="sw" type="button" style="margin-top:10px;background:transparent;color:var(--blue);border:1.5px solid var(--line)">New driver? Create account</button>
  </form>
</section>

<section id="dash" hidden>
  <header>DASHBOARD<button id="out">Sign out</button></header>
  <main>
    <div class="row one"><div class="c" id="esp"><div class="t">ESP32 connection</div><div class="v" id="espv"></div><div class="s" id="esps"></div></div></div>
    <div class="row">
      <div class="c" id="en"><div class="t">Entry gate</div><div class="v" id="env"></div></div>
      <div class="c" id="ex"><div class="t">Exit gate</div><div class="v" id="exv"></div></div>
    </div>
    <div class="row">
      <div class="c ok"><div class="t">Entry granted</div><div class="v" id="gr">0</div></div>
      <div class="c bad"><div class="t">Entry denied</div><div class="v" id="de">0</div></div>
    </div>
    <div class="row"><button class="act" id="bEnt">Entries</button><button class="act" id="bEdit">Edit access</button></div>
    <div class="row"><button class="act" id="bReq">New Driver Request<span class="nd" id="rdot" hidden></span></button><button class="act" id="bSp">Parking Spaces</button></div>
  </main>
</section>

<div id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mt">
    <div class="sh"><h2 id="mt"></h2><button class="x" id="mx">Close</button></div>
    <div class="qe" id="mm" role="alert"></div>
    <div id="ml"></div>
  </div>
</div>

<section id="user" hidden>
  <header><span class="pinb" id="pin"></span>PARKING<button id="out2">Sign out</button></header>
  <div class="c freec" id="freec"><div class="t">Parking spaces available</div><div class="v" id="freev"></div></div>
</section>

<section id="wait" hidden>
  <button id="out3">Sign out</button>
  <div class="w1">Waiting for approval</div>
  <div class="w2" id="wt2"></div>
</section>

<section id="revoked" hidden>
  <button id="out4">Sign out</button>
  <div class="w1">Your access has been Revoked</div>
  <div class="w2" id="wt3"></div>
</section>

<section id="denied" hidden>
  <button id="out5">Sign out</button>
  <div class="w1">Request Denied</div>
  <div class="w2" id="wt4"></div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.4/dist/umd/supabase.js"></script>
<script>
/* =====================================================================
   SMART PARKING GATEWAY - WEBPAGE (SUPABASE VERSION)
   Works with parking-supabase-setup-v2.sql. Fill in the two values below.
   ===================================================================== */

/* ---- Settings: FILL THESE IN ---- */
var SUPABASE_URL = "https://gtdzeulsiwjlkmoogmln.supabase.co/rest/v1/";   // Supabase > Project Settings > API Keys > Project URL
var SUPABASE_KEY = "sb_publishable_jmvx7Mdx4Jt9-_3q1Bqa5A_JCNXWifk";               // the PUBLISHABLE key only. NEVER the secret/service_role key.
var ADMIN_CONTACT = "rajveermatharu277@gmail.com";    // admin contact shown to drivers who are waiting, denied or revoked
var ESP_OFFLINE_AFTER_S = 20;        // the ESP32 counts as online if it reported within this many seconds
var POLL_MS = 5000;                  // how often the page re-checks the database (live updates arrive faster)

var sb = null;
var configured = SUPABASE_URL.indexOf("YOUR-PROJECT-ID") < 0 && SUPABASE_KEY.indexOf("YOUR_KEY") < 0;
try { if (configured && window.supabase) sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch (x) {}

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function fmtUid(u){ return u ? String(u).replace(/(..)(?=.)/g, "$1:") : ""; }   // DEADBEEF -> DE:AD:BE:EF
function fmtTime(t){ try { return new Date(t).toLocaleString([], {day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"}); } catch (x) { return ""; } }

/* ---- State ---- */
var profile = null;      // the signed-in account (profiles row): role admin / driver, status pending / approved / denied / revoked
var myDriver = null;     // a driver's own card and PIN row
var viewSpaces = false;  // admin is looking at the parking-spaces screen
var state = {total:0, taken:0, lastSeen:undefined, granted:0, denied:0, entry:"closed", exit:"closed"};
var espSeen, espChangedAt = 0, espFirstLoadAt = 0;
var drivers = [], requests = [], logRows = [], rfidCards = [], pinPool = [];
var view = null, pend = null, pt = null, reqKey = "";
var channel = null, pollTimer = null, clockTimer = null;

/* ---- Loading data from the database ---- */
async function loadStatus(){
  var r = await sb.from("gateway_status").select("*").eq("id", 1).maybeSingle();
  if (r.error || !r.data) return;
  var g = r.data;
  if (espSeen === undefined) { espSeen = g.esp_last_seen; espFirstLoadAt = Date.now(); }
  else if (g.esp_last_seen !== espSeen) { espSeen = g.esp_last_seen; espChangedAt = Date.now(); }
  state.lastSeen = g.esp_last_seen; state.granted = g.granted; state.denied = g.denied;
  state.entry = g.entry_gate; state.exit = g.exit_gate;
}
async function loadSpaces(){
  var r = await sb.from("parking_spaces").select("id,taken");
  if (r.error || !r.data) return;
  state.total = r.data.length;
  state.taken = r.data.filter(function(s){ return s.taken; }).length;
}
async function loadEntries(){
  var r = await sb.from("event_log").select("created_at,driver_code,name,rfid_uid,pin")
    .eq("event_type", "barrier_open_accepted").order("created_at", {ascending:false}).limit(100);
  if (!r.error && r.data) logRows = r.data;
  return r.error;
}
async function loadDrivers(){
  var r = await sb.from("drivers").select("*").order("is_master", {ascending:false}).order("created_at", {ascending:true});
  if (!r.error && r.data) drivers = r.data;
  return r.error;
}
async function loadRequests(){
  var r = await sb.from("profiles").select("id,email,name,created_at")
    .eq("role", "driver").eq("status", "pending").order("created_at", {ascending:true});
  if (!r.error && r.data) requests = r.data;
  return r.error;
}
async function loadPools(){
  var a = await sb.from("rfid_cards").select("uid").order("uid");
  var b = await sb.from("pin_pool").select("pin").order("pin");
  if (!a.error && a.data) rfidCards = a.data;
  if (!b.error && b.data) pinPool = b.data;
  return a.error || b.error;
}
async function loadMyDriver(){
  var r = await sb.from("drivers").select("pin,revoked_at").eq("user_id", profile.id).maybeSingle();
  if (!r.error) myDriver = r.data;
}
function freeRfids(){
  var used = drivers.map(function(d){ return d.rfid_uid; });
  return rfidCards.map(function(c){ return c.uid; }).filter(function(u){ return used.indexOf(u) < 0; });
}
function freePins(){
  var used = drivers.map(function(d){ return d.pin; });
  return pinPool.map(function(p){ return p.pin; }).filter(function(p){ return used.indexOf(p) < 0; });
}

/* ---- Showing data ---- */
function espInfo(){
  if (state.lastSeen === undefined) return {s:"checking"};
  if (state.lastSeen === null) return {s:"offline"};
  if (espChangedAt) {
    var secs = (Date.now() - espChangedAt) / 1000;
    return secs <= ESP_OFFLINE_AFTER_S ? {s:"online", secs:Math.round(secs)} : {s:"offline"};
  }
  // First look at the page: wait for one fresh report before deciding (avoids relying on this device's clock).
  var guess = (Date.now() - new Date(state.lastSeen).getTime()) / 1000;
  if (guess > 120) return {s:"offline"};
  return (Date.now() - espFirstLoadAt) / 1000 > ESP_OFFLINE_AFTER_S ? {s:"offline"} : {s:"checking"};
}
function gate(el, valEl, status, known){
  if (!known) { el.className = "c"; valEl.textContent = "Unknown"; return; }
  var open = status === "open";
  el.className = "c " + (open ? "warn" : "ok");
  valEl.textContent = open ? "Open" : "Closed";
}
function render(){
  if (!profile) return;
  if (profile.role === "admin") {
    var info = espInfo(), esp = $("esp");
    esp.className = "c " + (info.s === "online" ? "ok" : info.s === "offline" ? "bad" : "warn");
    $("espv").innerHTML = '<span class="dot"></span>' + (info.s === "online" ? "Online" : info.s === "offline" ? "Offline" : "Checking…");
    $("esps").textContent = info.s === "online" ? "Last message " + info.secs + "s ago" : info.s === "offline" ? "No signal from the gateway" : "";
    $("gr").textContent = state.granted;
    $("de").textContent = state.denied;
    gate($("en"), $("env"), state.entry, info.s === "online");
    gate($("ex"), $("exv"), state.exit, info.s === "online");
    dots();
  }
  renderSlots();
  showPin();
}
function renderSlots(){
  var n = state.total, free = Math.max(n - state.taken, 0);
  $("freec").className = "c freec " + (n > 0 && free > 0 ? "ok" : "bad");
  $("freev").textContent = n === 0 ? "No spaces set up" : (free > 0 ? free + " of " + n + " available" : "Parking full");
}
function showPin(){
  var el = $("pin");
  if (!profile || profile.role !== "driver") return;
  el.textContent = myDriver ? (myDriver.revoked_at ? "PIN - revoked" : "PIN - " + myDriver.pin) : "PIN - pending";
}
function dots(){ $("rdot").hidden = !requests.length; }

/* Decides which screen to show (the database security rules decide what data each account may read) */
function applyRole(){
  var role = profile ? profile.role : null, st = profile ? profile.status : null;
  var u = role === "driver";
  var sp = role === "admin" && viewSpaces;
  var ok = u && st === "approved";
  $("login").hidden = !!profile;
  $("dash").hidden = role !== "admin" || viewSpaces;
  $("user").hidden = !(sp || ok);
  $("out2").textContent = sp ? "Back" : "Sign out";
  $("pin").hidden = sp;
  $("wait").hidden = !(u && st === "pending");
  $("revoked").hidden = !(u && st === "revoked");
  $("denied").hidden = !(u && st === "denied");
  render();
}
$("wt2").textContent = "Contact the admin at - " + ADMIN_CONTACT;
$("wt3").textContent = "Contact the admin at - " + ADMIN_CONTACT;
$("wt4").textContent = "Contact admin at - " + ADMIN_CONTACT;

/* ---- Admin lists (Entries, Edit access, New driver requests) ---- */
function paint(){
  var h = "", ml = $("ml");
  if (view === "log") {
    $("mt").textContent = "Entries";
    if (!logRows.length) h = '<p class="empty">No entries yet.</p>';
    logRows.forEach(function(l){
      h += '<div class="r"><div><div class="n">' + esc(l.name || "Unknown") + '</div><div class="id">ID ' + esc(l.driver_code || "-") +
           ' · RFID ' + esc(fmtUid(l.rfid_uid)) + ' · PIN ' + esc(l.pin || "-") + ' · ' + esc(fmtTime(l.created_at)) +
           '</div></div><span class="tag in">Entered</span></div>';
    });
  } else if (view === "req") {
    $("mt").textContent = "New driver requests";
    reqKey = requests.map(function(q){ return q.id; }).join(",");
    if (!requests.length) h = '<p class="empty">No pending requests.</p>';
    var fr = freeRfids(), fp = freePins();
    requests.forEach(function(q, i){
      var po = '<option value="">Select PIN</option>' + fp.map(function(p){ return '<option value="' + esc(p) + '">' + esc(p) + '</option>'; }).join("");
      var o = '<option value="">Select RFID</option>' + fr.map(function(u){ return '<option value="' + esc(u) + '">' + esc(fmtUid(u)) + '</option>'; }).join("");
      h += '<div class="q"><div class="n">' + esc(q.name || "(no name)") + '</div><div class="id">' + esc(q.email) + ' · ' + esc(fmtTime(q.created_at)) +
           '</div><div class="qf"><select id="rf' + i + '" aria-label="RFID card">' + o + '</select><select id="pn' + i + '" aria-label="PIN code">' + po +
           '</select><button class="rs" data-a="ok" data-i="' + i + '">Approve</button><button class="rv" data-a="no" data-i="' + i +
           '">Decline</button></div><div class="qe" id="qe' + i + '" role="alert"></div></div>';
    });
    if (requests.length && (!fr.length || !fp.length)) {
      h += '<p class="empty">' + (!fr.length ? "No free RFID cards left. " : "") + (!fp.length ? "No free PINs left. " : "") + 'Add more in the database (rfid_cards / pin_pool).</p>';
    }
  } else {
    $("mt").textContent = "Edit access";
    if (!drivers.length) h = '<p class="empty">No drivers have access.</p>';
    drivers.forEach(function(d, i){
      var rev = !!d.revoked_at, b;
      if (d.is_master) b = '<span class="tag out">Master</span>';
      else if (rev) b = '<button class="rs" data-a="restore" data-i="' + i + '">Restore</button>';
      else b = '<button class="rv' + (pend === i ? ' on' : '') + '" data-a="revoke" data-i="' + i + '">' + (pend === i ? "Tap again to confirm" : "Revoke") + '</button>';
      h += '<div class="r"><div><div class="n">' + esc(d.name) + '</div><div class="id">ID ' + esc(d.driver_code) + ' · ' +
           (rev ? "RFID and PIN revoked" : "RFID " + esc(fmtUid(d.rfid_uid)) + " · PIN " + esc(d.pin)) + '</div></div>' + b + '</div>';
    });
  }
  ml.innerHTML = h;
}
function msg(t){ $("mm").textContent = t || ""; }
function friendlyErr(m){
  if (/duplicate key|unique/i.test(m)) return "That RFID card or PIN is already in use. Pick another.";
  return m;
}
async function openList(k){
  view = k; pend = null; clearTimeout(pt); msg("");
  $("mt").textContent = k === "log" ? "Entries" : k === "req" ? "New driver requests" : "Edit access";
  $("ml").innerHTML = '<p class="empty">Loading…</p>';
  $("modal").hidden = false;
  var err = null;
  if (k === "log") err = await loadEntries();
  else if (k === "access") { await sb.rpc("purge_revoked"); err = await loadDrivers(); }
  else { err = (await loadRequests()) || (await loadDrivers()) || (await loadPools()); dots(); }
  if (err) { $("ml").innerHTML = ""; msg("Could not load: " + err.message); return; }
  paint();
}
function closeList(){ $("modal").hidden = true; pend = null; msg(""); }
function repaintIfSafe(){
  if ($("modal").hidden) return;
  if (view === "log") paint();
  else if (view === "access" && pend === null) paint();
  else if (view === "req") {
    var key = requests.map(function(q){ return q.id; }).join(",");
    if (key !== reqKey) {
      var busy = false;
      $("ml").querySelectorAll("select").forEach(function(s){ if (s.value) busy = true; });
      if (!busy) paint();
    }
  }
}
async function revokeDriver(d){
  pend = null; msg("");
  var r = await sb.rpc("revoke_driver", {p_user: d.user_id});
  if (r.error) { msg(r.error.message); return; }
  await loadDrivers(); paint();
  // After 10 seconds the driver is removed and their ID, RFID card and PIN become free again.
  setTimeout(async function(){
    await sb.rpc("purge_revoked");
    await loadDrivers(); await loadPools();
    if (!$("modal").hidden && view === "access" && pend === null) paint();
  }, 10200);
}
async function restoreDriver(d){
  msg("");
  var r = await sb.rpc("restore_driver", {p_user: d.user_id});
  if (r.error) { msg(r.error.message); return; }
  if (r.data === false) msg("Too late to restore. The driver has been removed.");
  await loadDrivers(); paint();
}
async function reqAction(b){
  var i = +b.getAttribute("data-i"), q = requests[i], a = b.getAttribute("data-a"), er = $("qe" + i);
  if (!q) return;
  er.textContent = "";
  if (a === "no") {
    b.disabled = true;
    var r1 = await sb.rpc("decline_driver", {p_user: q.id});
    if (r1.error) { er.textContent = r1.error.message; b.disabled = false; return; }
    await loadRequests(); paint(); dots();
    return;
  }
  var u = $("rf" + i).value, p = $("pn" + i).value;
  if (!u) { er.textContent = "Choose an RFID card first."; return; }
  if (!p) { er.textContent = "Choose a PIN first."; return; }
  b.disabled = true;
  var r2 = await sb.rpc("approve_driver", {p_user: q.id, p_rfid: u, p_pin: p});
  if (r2.error) { er.textContent = friendlyErr(r2.error.message); b.disabled = false; return; }
  await loadRequests(); await loadDrivers(); await loadPools();
  paint(); dots();
}
$("ml").addEventListener("click", function(ev){
  var b = ev.target.closest("button"); if (!b) return;
  if (view === "req") { reqAction(b); return; }
  if (view !== "access") return;
  var i = +b.getAttribute("data-i"), d = drivers[i], a = b.getAttribute("data-a");
  if (!d) return;
  if (a === "restore") restoreDriver(d);
  else if (a === "revoke") {
    if (pend === i) revokeDriver(d);
    else { pend = i; clearTimeout(pt); pt = setTimeout(function(){ pend = null; paint(); }, 4000); paint(); }
  }
});
$("bEnt").addEventListener("click", function(){ openList("log"); });
$("bEdit").addEventListener("click", function(){ openList("access"); });
$("bReq").addEventListener("click", function(){ openList("req"); });
$("bSp").addEventListener("click", async function(){ closeList(); viewSpaces = true; await loadSpaces(); applyRole(); });
$("mx").addEventListener("click", closeList);
$("modal").addEventListener("click", function(ev){ if (ev.target === this) closeList(); });
document.addEventListener("keydown", function(ev){ if (ev.key === "Escape") closeList(); });

/* ---- Live updates ---- */
function startRealtime(){
  stopRealtime();
  if (!sb || !profile) return;
  var ch = sb.channel("pk-live");
  function on(table, fn, filter){
    var o = {event:"*", schema:"public", table:table};
    if (filter) o.filter = filter;
    ch.on("postgres_changes", o, fn);
  }
  if (profile.role === "admin") {
    on("gateway_status", async function(){ await loadStatus(); render(); });
    on("parking_spaces", async function(){ await loadSpaces(); render(); });
    on("event_log", async function(){ if (!$("modal").hidden && view === "log") { await loadEntries(); paint(); } });
    on("profiles", async function(){ await loadRequests(); dots(); repaintIfSafe(); });
    on("drivers", async function(){ await loadDrivers(); repaintIfSafe(); });
  } else {
    on("parking_spaces", async function(){ await loadSpaces(); render(); });
    on("profiles", function(){ refreshProfile(); }, "id=eq." + profile.id);
    on("drivers", async function(){ await loadMyDriver(); render(); }, "user_id=eq." + profile.id);
  }
  ch.subscribe();
  channel = ch;
}
function stopRealtime(){
  if (channel && sb) { try { sb.removeChannel(channel); } catch (x) {} }
  channel = null;
}
async function refreshProfile(){
  if (!profile) return;
  var r = await sb.from("profiles").select("*").eq("id", profile.id).maybeSingle();
  if (r.error || !r.data) return;
  var changed = r.data.status !== profile.status || r.data.role !== profile.role;
  profile = r.data;
  if (changed) {
    if (profile.role === "driver" && profile.status === "approved") { await loadMyDriver(); await loadSpaces(); }
    applyRole();
  }
}
async function tick(){
  if (!profile) return;
  try {
    await refreshProfile();
    if (!profile) return;
    if (profile.role === "admin") {
      await Promise.all([loadStatus(), loadRequests(), loadSpaces()]);
      render(); repaintIfSafe();
    } else if (profile.status === "approved") {
      await Promise.all([loadSpaces(), loadMyDriver()]);
      render();
    }
  } catch (x) {}
}
function startTimers(){
  stopTimers();
  pollTimer = setInterval(tick, POLL_MS);
  clockTimer = setInterval(render, 1000);   // keeps "Last message Ns ago" moving
}
function stopTimers(){
  clearInterval(pollTimer); clearInterval(clockTimer);
  pollTimer = null; clockTimer = null;
}

/* ---- Sign in / sign up / sign out ---- */
var signup = false;
function setMode(s){
  signup = s;
  $("go").textContent = s ? "Create account" : "Sign in";
  $("sw").textContent = s ? "Have an account? Sign in" : "New driver? Create account";
  $("sub").textContent = s ? "Create a driver account. The admin will then set up your gate access." : "Sign in to continue.";
  $("nmw").hidden = !s;
  $("err").textContent = "";
}
$("sw").addEventListener("click", function(){ setMode(!signup); });

async function enter(user){
  var r = await sb.from("profiles").select("*").eq("id", user.id).maybeSingle();
  if (r.error || !r.data) {
    await sb.auth.signOut();
    $("err").textContent = "Could not load your account. Ask the admin to check the database setup.";
    return;
  }
  profile = r.data;
  if (profile.role === "device") {
    await sb.auth.signOut(); profile = null;
    $("err").textContent = "This account belongs to the gateway and cannot use the webpage.";
    return;
  }
  viewSpaces = false; myDriver = null; espSeen = undefined; espChangedAt = 0;
  state.lastSeen = undefined;
  if (profile.role === "admin") {
    try { await sb.rpc("purge_revoked"); } catch (x) {}
    await Promise.all([loadStatus(), loadRequests(), loadDrivers(), loadPools(), loadSpaces()]);
  } else {
    await Promise.all([loadSpaces(), loadMyDriver()]);
  }
  setMode(false);
  $("pw").value = "";
  startRealtime();
  startTimers();
  applyRole();
}
function leave(){
  stopRealtime(); stopTimers(); closeList();
  profile = null; myDriver = null; viewSpaces = false;
  state = {total:0, taken:0, lastSeen:undefined, granted:0, denied:0, entry:"closed", exit:"closed"};
  espSeen = undefined; espChangedAt = 0;
  drivers = []; requests = []; logRows = []; rfidCards = []; pinPool = [];
  $("pw").value = "";
  setMode(false);
  applyRole();
}
async function signOut(){
  try { if (sb) await sb.auth.signOut(); } catch (x) {}
  leave();
}
$("out").addEventListener("click", signOut);
$("out3").addEventListener("click", signOut);
$("out4").addEventListener("click", signOut);
$("out5").addEventListener("click", signOut);
$("out2").addEventListener("click", function(){
  if (profile && profile.role === "admin") { viewSpaces = false; applyRole(); } else signOut();
});

$("f").addEventListener("submit", async function(ev){
  ev.preventDefault();
  var err = $("err"); err.textContent = "";
  if (!sb) {
    err.textContent = configured
      ? "Could not load the Supabase library. Check your internet connection and reload."
      : "First set SUPABASE_URL and SUPABASE_KEY at the top of the script in index.html.";
    return;
  }
  var email = $("em").value.trim().toLowerCase(), pw = $("pw").value, btn = $("go");
  btn.disabled = true;
  try {
    if (signup) {
      var nm = $("nm").value.trim();
      if (!nm) { err.textContent = "Enter your full name."; return; }
      if (pw.length < 6) { err.textContent = "Use a password with at least 6 characters."; return; }
      await sb.rpc("claim_email", {p_email: email});   // frees an email that belonged to a denied or revoked driver
      var r = await sb.auth.signUp({email: email, password: pw, options: {data: {name: nm}}});
      if (r.error) {
        err.textContent = /already/i.test(r.error.message) ? "That email already has an account. Sign in instead." : r.error.message;
        return;
      }
      if (!r.data.session) {
        setMode(false);
        err.textContent = "Account created. Check your email to confirm it, then sign in.";
        return;
      }
      await enter(r.data.user);
    } else {
      var r2 = await sb.auth.signInWithPassword({email: email, password: pw});
      if (r2.error) {
        err.textContent = /confirm/i.test(r2.error.message) ? "Confirm your email first (check your inbox), then sign in."
          : /invalid/i.test(r2.error.message) ? "Email or password is incorrect. Check both and try again."
          : r2.error.message;
        return;
      }
      await enter(r2.data.user);
    }
  } catch (x) {
    err.textContent = "Something went wrong: " + (x && x.message ? x.message : x);
  } finally {
    btn.disabled = false;
  }
});

/* ---- Start: restore a saved sign-in, or show the sign-in form ---- */
if (sb) {
  sb.auth.onAuthStateChange(function(event){ if (event === "SIGNED_OUT" && profile) leave(); });
  sb.auth.getSession().then(function(r){
    if (r.data && r.data.session) enter(r.data.session.user);
  });
}
applyRole();
</script>
